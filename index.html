<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Send no referer so Google-Drive-hosted images aren't hotlink-blocked. -->
  <meta name="referrer" content="no-referrer">
  <title>Samir — Personal Portfolio</title>
  <meta name="description" content="A personal portfolio — about me, my family, my roots, and our story.">

  <!-- Fonts (load when online; graceful fallback when offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>

  <nav class="topbar">
    <span class="brand">Samir</span>
    <div id="nav-links"></div>
    <span class="pdf-btns">
      <a class="btn-pdf" href="Samir-Portfolio-print.pdf" download title="Full print quality — crisp and selectable (larger file)">⬇ Download PDF</a>
      <a class="btn-pdf btn-pdf--fast" href="Samir-Portfolio-fast.pdf" download title="Small and quick to open — best for viewing on a phone">⚡ Fast</a>
    </span>
  </nav>

  <div id="app"><!-- rendered by js/render.js --></div>

  <!-- Loading overlay shown while the server builds the PDF -->
  <div id="pdf-overlay" aria-hidden="true">
    <div class="pdf-overlay-card">
      <div class="pdf-spinner"></div>
      <p>Preparing your PDF…</p>
      <span>Rendering the decorated keepsake — just a moment.</span>
    </div>
  </div>

  <!-- Image lightbox (tap any photo to enlarge) -->
  <div id="lightbox" aria-hidden="true">
    <button class="lb-close" aria-label="Close">✕</button>
    <button class="lb-prev" aria-label="Previous photo">‹</button>
    <button class="lb-next" aria-label="Next photo">›</button>
    <figure class="lb-figure">
      <img class="lb-img" src="" alt="">
      <figcaption class="lb-cap"></figcaption>
    </figure>
  </div>

  <!-- Decorative border shown only when printing / saving as PDF.
       A fixed element repeats on every printed page. -->
  <div class="print-frame" aria-hidden="true">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <span class="mid top"></span><span class="mid bot"></span>
  </div>

  <footer>
    Made with care. · <a href="admin.html" style="color:inherit;">Edit this page</a>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/util.js"></script>
  <script src="js/render.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/lightbox.js"></script>
</body>
</html>
